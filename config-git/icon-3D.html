                  <stop offset="0%" stop-color="#7e9bfd"></stop>
                  <!-- Ponto de Luz Forte (Azul Claro) -->
                  <stop offset="35%" stop-color="#2d4bc4"></stop>
                  <!-- Tom Médio Vibrante -->
                  <stop offset="75%" stop-color="#071559"></stop>
                  <!-- Base pedida #071559 -->
                  <stop offset="100%" stop-color="#03092b"></stop>
                  <!-- Sombra de Borda -->
                </radialGradient>

                <!-- Gradient 3D para Fone / Arco / Detalhes -->
                <linearGradient
                  id="earpiece3DGrad"
                  x1="0%"
                  y1="0%"
                  x2="100%"
                  y2="100%"

                  <stop offset="40%" stop-color="#2137a8"></stop>
                  <stop offset="100%" stop-color="#071559"></stop>

                  y="-20%"

                  height="140%"

                    dy="2"
                    stdDeviation="1.5"
